name: Frontend CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: mp-frontend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './starter/frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: CI=true npm test

  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/frontend

    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag Output
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./starter/frontend
          file: ./starter/frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EKS via Kustomize
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/frontend/k8s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          clusters:
          - cluster:
              certificate-authority-data: ${{ secrets.EKS_CA_DATA }}
              server: ${{ secrets.EKS_ENDPOINT }}
            name: cluster
          contexts:
          - context:
              cluster: cluster
              user: github-action-user
            name: cluster
          current-context: cluster
          kind: Config
          users:
          - name: github-action-user
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1beta1
                command: aws
                args:
                - eks
                - get-token
                - --cluster-name
                - cluster
                - --region
                - us-east-1
          EOF

          kubectl get nodes
          
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy Manifests
        run: |
          kustomize edit set image frontend=${{ needs.build-and-push.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}
          kustomize build . | kubectl apply -f -
