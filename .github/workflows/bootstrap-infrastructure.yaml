name: Bootstrap AWS Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.9

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_BOOTSTRAP_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create AWS resources
        working-directory: setup/terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Allow GitHub Actions IAM user to access Kubernetes
        working-directory: setup
        run: ./init.sh
